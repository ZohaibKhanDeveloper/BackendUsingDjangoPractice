<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}}</title>
    <style>
        *{
            font-family:sans-serif;
            padding:5px;
            padding-top:0px;
        }
        h2{
            background-color: rgb(255,56,56);
            color:white;
            padding:10px;
            border-radius:5px;
            box-sizing:border-box;
        }
        ul{
            border-radius:5px;
            list-style-type:none;
            padding:10px;
        }
        ul li{
            line-height:30px;
        }
    </style>
</head>
<body>
    <h2>{{name}}</h2>
    <ul>
        <li>Page Name: <b>{{name}}</b></li>
        <li>Developer: <b>{{developer}}</b></li>
        <li>Semester: <b>{{semester}}</b></li>
        <li>Cummulative Grade Percentage Average (CGPA): <b>{{CGPA}}</b></li>
        <li>Institute: <i><b>ISLAMIA COLLEGE PESHAWER</b></i></li>
    </ul>
</body>
</html>
